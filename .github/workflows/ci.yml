name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Storybook tests (Vitest + Playwright Chromium, axe on every story) and unit tests
      - run: npm test
      - run: npx shadcn registry validate
      - run: npm run build:registry -- --strict
      - name: Fail if registry.json or public/r is out of date
        run: |
          if [ -n "$(git status --porcelain -- registry.json public/r)" ]; then
            git status --porcelain -- registry.json public/r
            echo "Run npm run build:registry and commit registry.json and public/r."
            exit 1
          fi
      - run: npm run build:storybook
